name: Update Market Data

on:
  schedule:
    - cron: '5 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests pandas
          fi

      - name: Run update script
        env:
          FUNDING_FAILURE_POLICY: fail
          NON_FATAL_ISSUES_OUTPUT: ${{ runner.temp }}/non_fatal_data_update_issues.md
        run: python scripts/update_data.py

      - name: Publish non-fatal update issues summary
        if: always()
        run: |
          ISSUE_FILE="${{ runner.temp }}/non_fatal_data_update_issues.md"
          if [ -s "$ISSUE_FILE" ]; then
            cat "$ISSUE_FILE" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit and push updated data
        run: |
          if [ -z "$(git status --porcelain -- data)" ]; then
            echo "No data changes detected"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Update market data: $(date -u +'%Y-%m-%d')"
          git push
