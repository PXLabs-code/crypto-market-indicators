name: Strategy Backtest

on:
  workflow_dispatch:
  push:
    paths:
      - 'data/**'

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install pandas numpy plotly requests
          fi

      - name: Run backtest
        run: python scripts/backtest.py > backtest_summary.md

      - name: Publish performance summary
        if: always()
        run: |
          if [ -f backtest_summary.md ]; then
            cat backtest_summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -f reports/backtest_dashboard.html ]; then
            {
              echo ""
              echo "> 📊 完整交互式看板（可切换策略买卖信号、排序绩效表格、显隐净值/回撤曲线）请在本次运行的 **Artifacts** 中下载 \`backtest-reports\` 并打开 \`backtest_dashboard.html\` 查看。"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          rm -f backtest_summary.md

      - name: Upload reports artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-reports
          path: reports/
          if-no-files-found: error
