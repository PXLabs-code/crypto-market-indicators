name: Strategy Backtest

on:
  workflow_dispatch:
  push:
    paths:
      - 'data/**'

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install system CJK font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install pandas numpy matplotlib requests
          fi

      - name: Run backtest
        run: python scripts/backtest.py

      - name: Publish performance summary
        if: always()
        run: |
          if [ -f reports/performance_summary.md ]; then
            cat reports/performance_summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -f reports/backtest_dashboard.png ]; then
            {
              echo ""
              echo "### 看板图预览"
              echo ""
              echo "![backtest dashboard](data:image/png;base64,$(base64 -w 0 reports/backtest_dashboard.png))"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload reports artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-reports
          path: reports/
          if-no-files-found: error
